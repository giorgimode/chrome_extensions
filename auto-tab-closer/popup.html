<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Tab Closer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 420px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e94560;
      letter-spacing: 0.5px;
    }

    #add-btn {
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 11px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    #add-btn:hover { background: #c73652; }

    #patterns-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
    }

    .pattern-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 7px;
      padding: 10px 12px;
    }

    .pattern-card.disabled {
      opacity: 0.5;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-header input[type="text"].name-field {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .card-header input[type="text"].name-field:focus {
      border-bottom: 1px solid #e94560;
    }

    .toggle {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider { background: #e94560; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(14px); }

    .delete-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
    }

    .delete-btn:hover { color: #e94560; }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-row + .field-row { margin-top: 6px; }

    label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #888;
    }

    .field-row input[type="text"] {
      background: #0f3460;
      border: 1px solid #1a4a8a;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      font-family: monospace;
      padding: 5px 8px;
      outline: none;
      width: 100%;
    }

    .field-row input[type="text"]:focus {
      border-color: #e94560;
    }

    .hint {
      font-size: 10px;
      color: #555;
      margin-top: 2px;
    }

    footer {
      padding: 8px 16px;
      border-top: 1px solid #0f3460;
      background: #16213e;
    }

    #save-btn {
      width: 100%;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    #save-btn:hover { background: #c73652; }

    #status {
      text-align: center;
      font-size: 11px;
      color: #4caf50;
      min-height: 16px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Auto Tab Closer</h1>
    <button id="add-btn">+ Add Pattern</button>
  </header>

  <div id="patterns-list"></div>

  <footer>
    <button id="save-btn">Save</button>
    <div id="status"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
